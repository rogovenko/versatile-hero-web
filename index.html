<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MazeBuilderNew</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #141c21; }
    #unity-canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px;
      color: #e1e7eb; font: 16px system-ui, sans-serif; text-align: center; background: #141c21; }
    #loading[hidden] { display: none; }
    progress { width: min(280px, 75vw); accent-color: #cfb981; }
    #status { max-width: min(480px, 85vw); overflow-wrap: anywhere; }
    #fullscreen-button { position: fixed; top: max(8px, env(safe-area-inset-top));
      left: max(8px, env(safe-area-inset-left)); z-index: 10; width: 40px; height: 40px;
      display: grid; place-items: center; padding: 8px; border: 1px solid #cfb98199;
      border-radius: 10px; background: #141c21cc; color: #e1e7eb; cursor: pointer;
      touch-action: manipulation; }
    #fullscreen-button:hover, #fullscreen-button:focus-visible { background: #293b43; outline: 2px solid #cfb981; }
    #fullscreen-button[hidden] { display: none; }
    #fullscreen-button svg { width: 22px; height: 22px; pointer-events: none; }
    #fullscreen-message { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 48px);
      left: max(8px, env(safe-area-inset-left)); z-index: 10; max-width: min(300px, 80vw);
      padding: 10px 12px; border-radius: 8px; background: #141c21ed;
      color: #e1e7eb; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" width="800" height="450" tabindex="0"></canvas>
  <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5" />
    </svg>
  </button>
  <div id="fullscreen-message" role="status" hidden></div>
  <div id="loading" role="status"><div id="status">Loading MazeBuilderNew…</div><progress id="progress" max="1" value="0"></progress></div>
  <script src="Build/WebRelease.loader.js"></script>
  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const progress = document.getElementById("progress");
    const fullscreenButton = document.getElementById("fullscreen-button");
    const fullscreenMessage = document.getElementById("fullscreen-message");
    const fullscreenRoot = document.documentElement;
    let fullscreenPending = false;
    let enteredFullscreen = false;
    let fullscreenMessageTimer;
    const isFullscreen = () => Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    function syncFullscreen() {
      const active = isFullscreen();
      fullscreenButton.hidden = active;
      enteredFullscreen ||= active;
      fullscreenButton.setAttribute("aria-pressed", String(active));
      const label = active ? "Exit fullscreen" : "Enter fullscreen";
      fullscreenButton.setAttribute("aria-label", label);
      fullscreenButton.title = label;
      if (active) fullscreenMessage.hidden = true;
    }
    function showFullscreenMessage(message) {
      clearTimeout(fullscreenMessageTimer);
      fullscreenMessage.textContent = message;
      fullscreenMessage.hidden = false;
      fullscreenMessageTimer = setTimeout(() => { fullscreenMessage.hidden = true; }, 6000);
    }
    async function enterFullscreen(manual = false) {
      if (isFullscreen() || fullscreenPending) return;
      const request = fullscreenRoot.requestFullscreen || fullscreenRoot.webkitRequestFullscreen;
      if (!request) {
        if (manual) showFullscreenMessage("This browser does not support fullscreen. Try adding the game to your Home Screen.");
        return;
      }
      fullscreenPending = true;
      try {
        await request.call(fullscreenRoot);
        syncFullscreen();
      } catch (_) {
        // Automatic requests may be blocked until a real click or tap.
        if (manual) showFullscreenMessage("Fullscreen is unavailable here. Try opening the game directly in your browser.");
      } finally {
        fullscreenPending = false;
      }
    }
    fullscreenButton.addEventListener("click", async () => {
      if (isFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        try { if (exit) await exit.call(document); } catch (_) { /* Keep the game usable. */ }
      } else {
        await enterFullscreen(true);
      }
      canvas.focus();
    });
    document.addEventListener("fullscreenchange", syncFullscreen);
    document.addEventListener("webkitfullscreenchange", syncFullscreen);
    // Retry once on the first game gesture; never force re-entry after the user exits.
    document.addEventListener("pointerup", event => {
      if (!enteredFullscreen && !fullscreenButton.contains(event.target)) enterFullscreen();
    }, { once: true });
    const config = {
      arguments: [],
      dataUrl: "Build/WebRelease.data.unityweb",
      frameworkUrl: "Build/WebRelease.framework.js.unityweb",
      codeUrl: "Build/WebRelease.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "MazeBuilderNew",
      productVersion: "0.1.0",
      // Keep dense phone displays from multiplying fill-rate and render-target memory.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5,
        1920 / Math.max(window.innerWidth, window.innerHeight, 1)),
      // AchievementProgressStore writes files under persistentDataPath.
      autoSyncPersistentDataPath: true,
      showBanner(message, type) {
        if (type === "error") {
          loading.hidden = false;
          progress.hidden = true;
          status.textContent = message;
        } else {
          console.warn(message);
        }
      }
    };
    async function selectTextureData() {
      const probe = document.createElement("canvas");
      const gl = probe.getContext("webgl2");
      const supportsAstc = gl && gl.getExtension("WEBGL_compressed_texture_astc");
      if (gl) {
        const lose = gl.getExtension("WEBGL_lose_context");
        if (lose) lose.loseContext();
      }
      if (!supportsAstc) return;
      try {
        const response = await fetch("Build/texture-variants.json", { cache: "no-cache" });
        if (response.ok) {
          const variants = await response.json();
          if (typeof variants.astc === "string" && variants.astc.startsWith("Build/"))
            config.dataUrl = variants.astc;
        }
      } catch (error) {
        console.warn("Using the default texture data.", error);
      }
    }
    selectTextureData().then(() => createUnityInstance(canvas, config, value => { progress.value = value; }))
      .then(instance => {
        window.unityInstance = instance;
        loading.hidden = true;
        canvas.focus();
        if (!enteredFullscreen) enterFullscreen();
      })
      .catch(error => {
        loading.hidden = false;
        progress.hidden = true;
        status.textContent = "Unable to start the game. Please reload the page. " + error;
      });
  </script>
</body>
</html>
