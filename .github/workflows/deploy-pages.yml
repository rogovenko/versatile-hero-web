name: Publish Web release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Assemble the release and optional preview
        shell: bash
        run: |
          set -euo pipefail
          assemble_build() {
            local source="$1" output="$2" name="$3"
            mkdir -p "$output/Build"
            cp "$source/index.html" "$source/build-sha256.txt" "$output/"
            cp "$source/Build/$name.loader.js" "$source/Build/$name.framework.js.unityweb" "$source/Build/$name.wasm.unityweb" "$output/Build/"
            cat "$source/Build/$name.data.unityweb".part* > "$output/Build/$name.data.unityweb"
            (cd "$output" && sha256sum --check build-sha256.txt)
          }
          assemble_build . _site WebRelease
          if [ -d preview ]; then
            assemble_build preview _site/preview WebPreview
          fi
          cp .nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
